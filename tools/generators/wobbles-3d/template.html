<style>
  /* The site's fonts and palette (assets/css/base.css), copied here so the prototype stands alone */
  @font-face { font-family: 'Bangers'; font-weight: 400; font-display: swap; src: url('fonts/bangers-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 400 900; font-display: swap; src: url('fonts/nunito-latin.woff2') format('woff2'); }
  :root {
    --bg1: #150726; --bg2: #2a0a4a; --bg3: #0b1e3f;
    --pink: #ff2e88; --yellow: #ffd23f; --cyan: #2ee6d6; --lime: #9dff3a; --purple: #8a4dff;
    --ink: #fff; --muted: rgba(255, 255, 255, 0.72); --glass: rgba(255, 255, 255, 0.08); --glass-border: rgba(255, 255, 255, 0.16);
    --font-display: 'Bangers', 'Impact', 'Arial Black', sans-serif; --font-body: 'Nunito', system-ui, -apple-system, sans-serif;
    --fondo:
      radial-gradient(1200px 600px at 10% -10%, rgba(255, 46, 136, 0.35), transparent 60%),

  * { box-sizing: border-box; }

<body>
<header>
  <a href="../" aria-label="Volver a los prototipos">‹</a>
  <h1>⚖️ <span>La Balanza</span></h1>
  <button id="mute" aria-label="Sonido">🔊</button>

<main>
  <canvas id="cv"></canvas>
  <div id="hud"><span id="count"></span><span id="chip"></span><span id="score"></span></div>
  <div id="card"><div class="in">
    <div id="cEmoji"></div><h2 id="cTitle"></h2><div id="cBody"></div><button id="cBtn"></button>
  </div></div>
</main>
<script>
'use strict';
/**
 * ⚖️ La Balanza — lab prototype. Shapes ride a rail over a plank balanced on a rock; a tap drops the one
 * in the claw. They never stop coming, quicker each time, and they pile up: the first one that ends in
 * the water ends the game.
 *
 * Three parts: the physics (rigid bodies, pure), the game (the pile, the claw, the score, pure) and the
 * view (canvas, sound, input). The first two run on a fixed step and use only + − × ÷ and sqrt, like
 * Tren en Vilo's engine, so one seed and the same taps give the same game in every browser.
 *
 * The pile can grow without end because only its top is simulated piece by piece: once a piece is
 * buried and at rest it is welded to the plank (physics: `mkPart`; game: `weld`).
 */

/* ================================================================== */
/* Physics: convex polygons and circles, sequential impulses           */
/* ================================================================== */
const DT = 1 / 120, GRAV = 1100, ITER = 10, SLOP = 0.5, BETA = 0.2, MAX_BIAS = 70, REST_V = 70, ROLL = 5.5;
const PI = 3.141592653589793, C30 = 0.8660254037844386;

/** A convex polygon from its points: centred on its centroid, clockwise on screen (y down), with its outward normals. */
function mkPoly(pts) {
  const n = pts.length; let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < n; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % n], k = x1 * y2 - x2 * y1; a += k; cx += (x1 + x2) * k; cy += (y1 + y2) * k; }
  cx /= 3 * a; cy /= 3 * a; a /= 2;
  const p = pts.map(([x, y]) => [x - cx, y - cy]);
  if (a < 0) { p.reverse(); a = -a; }
  let inertia = 0, r = 0; const nrm = [];
  for (let i = 0; i < n; i++) {
    const [x1, y1] = p[i], [x2, y2] = p[(i + 1) % n], k = x1 * y2 - x2 * y1;
    inertia += k * (x1 * x1 + x1 * x2 + x2 * x2 + y1 * y1 + y1 * y2 + y2 * y2);
    const ex = x2 - x1, ey = y2 - y1, l = Math.sqrt(ex * ex + ey * ey); nrm.push([ey / l, -ex / l]);
    r = Math.max(r, Math.sqrt(x1 * x1 + y1 * y1));
  }
  return { kind: 'poly', p, nrm, area: a, inertia: inertia / 12, r };
}
const mkCircle = r => ({ kind: 'circle', r, area: PI * r * r, inertia: PI * r * r * r * r / 2 });
const rect = (w, h) => Object.assign(mkPoly([[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]]), { w, h });
const tri = s => mkPoly([[0, -s * C30], [s / 2, 0], [-s / 2, 0]]);
/** Half a disc, flat side down, in steps of 30°. */
const dome = r => mkPoly([[-1, 0], [-C30, -0.5], [-0.5, -C30], [0, -1], [0.5, -C30], [C30, -0.5], [1, 0]].map(([x, y]) => [x * r, y * r]));

/** A body. Mass is density × area / 1000, so a 42 px cube weighs about 1.8. */
function mkBody(id, shape, x, y, { density = 1, fr = 0.9, re = 0 } = {}) {
  const m = density * shape.area / 1000, n = shape.p ? shape.p.length : 0;
  const b = { id, shape, x, y, vx: 0, vy: 0, c: 1, s: 0, w: 0, m, invM: 1 / m, invI: 1000 / (density * shape.inertia), fr, re,
    wx: new Array(n), wy: new Array(n), nx: new Array(n), ny: new Array(n), minx: 0, maxx: 0, miny: 0, maxy: 0, touch: false, air: 0 };
  place(b); return b;
}
/** World points, normals and bounding box from the body's position and rotation (c, s). */
function place(b) {
  const sh = b.shape;
  if (sh.kind === 'circle') { b.minx = b.x - sh.r; b.maxx = b.x + sh.r; b.miny = b.y - sh.r; b.maxy = b.y + sh.r; return; }
  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  for (let i = 0; i < sh.p.length; i++) {
    const lx = sh.p[i][0], ly = sh.p[i][1], x = b.x + b.c * lx - b.s * ly, y = b.y + b.s * lx + b.c * ly;
    b.wx[i] = x; b.wy[i] = y;
    if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y;
    const mx = sh.nrm[i][0], my = sh.nrm[i][1]; b.nx[i] = b.c * mx - b.s * my; b.ny[i] = b.s * mx + b.c * my;
  }
  b.minx = minx; b.maxx = maxx; b.miny = miny; b.maxy = maxy;
}

/**
 * A contact: the normal goes from a to b. A and B are what touch: a body, or a part welded to the plank,
 * and then the body that takes the push is the plank itself (its `owner`). `fid` names the features
 * that touch, to carry the impulse to the next step.
 */
const con = (A, B, nx, ny, px, py, pen, fid) => ({ a: A.owner || A, b: B.owner || B, nx, ny, px, py, pen, key: (A.id * 4096 + B.id) * 2048 + fid, pn: 0, pt: 0,
  fr: Math.sqrt(A.fr * B.fr), re: Math.max(A.re, B.re), rax: 0, ray: 0, rbx: 0, rby: 0, mn: 0, mt: 0, bias: 0 });

/** The face of A that B is furthest outside of: [separation, face]. */
function maxSep(A, B) {
  let best = -Infinity, bi = 0;
  for (let i = 0; i < A.wx.length; i++) {
    const nx = A.nx[i], ny = A.ny[i], vx = A.wx[i], vy = A.wy[i]; let m = Infinity;
    for (let j = 0; j < B.wx.length; j++) { const d = nx * (B.wx[j] - vx) + ny * (B.wy[j] - vy); if (d < m) m = d; }
    if (m > best) { best = m; bi = i; }
  }
  return [best, bi];
}
function clip(p, nx, ny, off) {
  const d0 = nx * p[0][0] + ny * p[0][1] - off, d1 = nx * p[1][0] + ny * p[1][1] - off, out = [];
  if (d0 <= 0) out.push(p[0]);
  if (d1 <= 0) out.push(p[1]);
  if (d0 * d1 < 0) { const t = d0 / (d0 - d1); out.push([p[0][0] + t * (p[1][0] - p[0][0]), p[0][1] + t * (p[1][1] - p[0][1])]); }
  return out;
}
/** Two polygons: the reference face is the one of least penetration; the other's facing edge, clipped to it, gives up to two points. */
function polyPoly(A, B, out) {
  const [sa, ia] = maxSep(A, B); if (sa > 0) return;
  const [sb, ib] = maxSep(B, A); if (sb > 0) return;
  const flip = sb > sa + 0.05, R = flip ? B : A, I = flip ? A : B, ri = flip ? ib : ia;
  const nx = R.nx[ri], ny = R.ny[ri], n = I.wx.length;
  let ii = 0, md = Infinity;
  for (let j = 0; j < n; j++) { const d = nx * I.nx[j] + ny * I.ny[j]; if (d < md) { md = d; ii = j; } }
  const i2 = (ii + 1) % n, r2 = (ri + 1) % R.wx.length;
  const v1x = R.wx[ri], v1y = R.wy[ri], v2x = R.wx[r2], v2y = R.wy[r2], tx = -ny, ty = nx;
  let p = [[I.wx[ii], I.wy[ii]], [I.wx[i2], I.wy[i2]]];
  p = clip(p, -tx, -ty, -(tx * v1x + ty * v1y)); if (p.length < 2) return;
  p = clip(p, tx, ty, tx * v2x + ty * v2y); if (p.length < 2) return;
  for (let k = 0; k < 2; k++) {
    const sep = nx * (p[k][0] - v1x) + ny * (p[k][1] - v1y);
    if (sep <= 0) out.push(con(A, B, flip ? -nx : nx, flip ? -ny : ny, p[k][0], p[k][1], -sep, (flip ? 1 : 0) + 2 * ri + 32 * ii + 512 * k));
  }
}
function polyCircle(P, C, out) {
  const r = C.shape.r, n = P.wx.length; let best = -Infinity, bi = 0;
  for (let i = 0; i < n; i++) { const d = P.nx[i] * (C.x - P.wx[i]) + P.ny[i] * (C.y - P.wy[i]); if (d > r) return; if (d > best) { best = d; bi = i; } }
  const j = (bi + 1) % n, v1x = P.wx[bi], v1y = P.wy[bi], v2x = P.wx[j], v2y = P.wy[j], nx = P.nx[bi], ny = P.ny[bi];
  const u1 = (C.x - v1x) * (v2x - v1x) + (C.y - v1y) * (v2y - v1y), u2 = (C.x - v2x) * (v1x - v2x) + (C.y - v2y) * (v1y - v2y);
  if (best > 1e-6 && (u1 <= 0 || u2 <= 0)) {
    const vx = u1 <= 0 ? v1x : v2x, vy = u1 <= 0 ? v1y : v2y, dx = C.x - vx, dy = C.y - vy, d2 = dx * dx + dy * dy;
    if (d2 > r * r) return;
    const d = Math.sqrt(d2) || 1e-6;
    out.push(con(P, C, dx / d, dy / d, vx, vy, r - d, 1));
  } else out.push(con(P, C, nx, ny, C.x - nx * r, C.y - ny * r, r - best, 0));
}
function circleCircle(A, B, out) {
  const dx = B.x - A.x, dy = B.y - A.y, rr = A.shape.r + B.shape.r, d2 = dx * dx + dy * dy;
  if (d2 > rr * rr) return;
  const d = Math.sqrt(d2) || 1e-6, nx = dx / d, ny = dy / d;
  out.push(con(A, B, nx, ny, A.x + nx * A.shape.r, A.y + ny * A.shape.r, rr - d, 0));
}
function collide(a, b, out) {
  const pa = a.shape.kind === 'poly', pb = b.shape.kind === 'poly';
  if (pa && pb) polyPoly(a, b, out); else if (pa) polyCircle(a, b, out); else if (pb) polyCircle(b, a, out); else circleCircle(a, b, out);
}
function impulse(k, px, py) {
  const a = k.a, b = k.b;
  a.vx -= a.invM * px; a.vy -= a.invM * py; a.w -= a.invI * (k.rax * py - k.ray * px);
  b.vx += b.invM * px; b.vy += b.invM * py; b.w += b.invI * (k.rbx * py - k.rby * px);
}

/**
 * A part of the plank: a shape fixed to it at (lx, ly) from its centre, turned by (rc, rs). The end stops
 * are parts, and so is every piece of the pile once it is buried: it stops being a body of its own and
 * becomes one more shape of the plank, which carries its weight (`m`).
 */
function mkPart(pl, id, shape, lx, ly, rc, rs, o) {
  const n = shape.p ? shape.p.length : 0;
  const q = Object.assign({ id, shape, owner: pl, lx, ly, rc, rs, fr: 0.6, re: 0.05, m: 0, x: 0, y: 0, c: 1, s: 0,
    wx: new Array(n), wy: new Array(n), nx: new Array(n), ny: new Array(n), minx: 0, maxx: 0, miny: 0, maxy: 0 }, o);
  seat(q); return q;
}
/** Puts a part where the plank carries it. */
function seat(q) {
  const pl = q.owner;
  q.x = pl.x + pl.c * q.lx - pl.s * q.ly; q.y = pl.y + pl.s * q.lx + pl.c * q.ly;
  q.c = pl.c * q.rc - pl.s * q.rs; q.s = pl.s * q.rc + pl.c * q.rs;
  place(q);
}

/**
 * One step of the world W: { bodies, plank, prev, K, D, smax }. `bodies` are the loose pieces. The plank
 * cannot move, only turn about its centre (invM = 0), with its parts: a spring (K) pulls it level and a
 * damper (D) calms it; `load` is the weight welded to it, as mass × arm, and `mass` how much that is;
 * `smax` is the sine of the angle where it stops.
 *
 * The spring and the damper grow with the welded mass (× 1 + mass / SPRING_M). With a fixed spring a
 * big pile would tip at the slightest thing: its lean would go by its weight times how far off centre
 * it is. Like this the lean goes by how far off centre the pile's weight is, whatever its size, so the
 * thing to watch stays the same from the first piece to the hundredth.
 */
function stepWorld(W) {
  const bs = W.bodies, pl = W.plank;
  for (const b of bs) { b.touch = false; b.vy += GRAV * DT; if (b.air) b.vx += b.air * DT; }
  pl.w += ((-W.K * pl.s - W.D * pl.w) * PLANK_I * (1 + pl.mass / SPRING_M) + GRAV * pl.load * pl.c) * pl.invI * DT;

  const cs = [];
  for (let i = 0; i < bs.length; i++) {
    const b = bs[i];
    if (!(pl.maxx < b.minx || b.maxx < pl.minx || pl.maxy < b.miny || b.maxy < pl.miny)) collide(pl, b, cs);
    for (const q of pl.parts) if (!(q.maxx < b.minx || b.maxx < q.minx || q.maxy < b.miny || b.maxy < q.miny)) collide(q, b, cs);
    for (let j = i + 1; j < bs.length; j++) {
      const a = bs[j];
      if (!(a.maxx < b.minx || b.maxx < a.minx || a.maxy < b.miny || b.maxy < a.miny)) collide(b, a, cs);
    }
  }
  const now = new Map();
  for (const k of cs) { const o = W.prev.get(k.key); if (o) { k.pn = o.pn; k.pt = o.pt; } now.set(k.key, k); }
  W.prev = now;

  for (const k of cs) {
    const a = k.a, b = k.b, tx = -k.ny, ty = k.nx;
    k.rax = k.px - a.x; k.ray = k.py - a.y; k.rbx = k.px - b.x; k.rby = k.py - b.y;
    const rna = k.rax * k.ny - k.ray * k.nx, rnb = k.rbx * k.ny - k.rby * k.nx, rta = k.rax * ty - k.ray * tx, rtb = k.rbx * ty - k.rby * tx;
    k.mn = 1 / (a.invM + b.invM + a.invI * rna * rna + b.invI * rnb * rnb);
    k.mt = 1 / (a.invM + b.invM + a.invI * rta * rta + b.invI * rtb * rtb);
    k.bias = Math.min(MAX_BIAS, BETA / DT * Math.max(0, k.pen - SLOP));
    const vn = (b.vx - b.w * k.rby - a.vx + a.w * k.ray) * k.nx + (b.vy + b.w * k.rbx - a.vy - a.w * k.rax) * k.ny;
    if (vn < -REST_V && -k.re * vn > k.bias) k.bias = -k.re * vn;
    impulse(k, k.pn * k.nx + k.pt * tx, k.pn * k.ny + k.pt * ty);
  }
  for (let it = 0; it < ITER; it++) for (const k of cs) {
    const a = k.a, b = k.b, tx = -k.ny, ty = k.nx;
    let dvx = b.vx - b.w * k.rby - a.vx + a.w * k.ray, dvy = b.vy + b.w * k.rbx - a.vy - a.w * k.rax;
    let d = k.mn * (k.bias - (dvx * k.nx + dvy * k.ny)); const pn0 = k.pn;
    k.pn = Math.max(pn0 + d, 0); d = k.pn - pn0;
    impulse(k, d * k.nx, d * k.ny);
    dvx = b.vx - b.w * k.rby - a.vx + a.w * k.ray; dvy = b.vy + b.w * k.rbx - a.vy - a.w * k.rax;
    d = -k.mt * (dvx * tx + dvy * ty); const pt0 = k.pt, max = k.fr * k.pn;
    k.pt = Math.max(-max, Math.min(max, pt0 + d)); d = k.pt - pt0;
    impulse(k, d * tx, d * ty);
  }
  for (const k of cs) if (k.pn > 0) { k.a.touch = true; k.b.touch = true; }

  if ((pl.s >= W.smax && pl.w > 0) || (pl.s <= -W.smax && pl.w < 0)) pl.w = 0;
  {
    const c = pl.c - pl.s * pl.w * DT, s = pl.s + pl.c * pl.w * DT, l = 1 / Math.sqrt(c * c + s * s);
    pl.c = c * l; pl.s = s * l;
    if (pl.s > W.smax || pl.s < -W.smax) { pl.s = pl.s > 0 ? W.smax : -W.smax; pl.c = Math.sqrt(1 - pl.s * pl.s); }
    place(pl);
    for (const q of pl.parts) seat(q);

  for (const b of bs) {

  } else if (e.type === 'debut') { banner = { kind: e.kind, t: 0 }; SFX.round(); }
}
function fx(dt) {
  for (const p of parts) { p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.t < p.life);
  for (const f of floats) f.t += dt; floats = floats.filter(f => f.t < 0.9);
  for (const s of says) s.t += dt; says = says.filter(s => s.t < 1.3);
  if (banner && (banner.t += dt) > 2.4) banner = null;
  shake = Math.max(0, shake - dt); ring = Math.max(0, ring - dt * 1.6);
  // The camera pulls back as the pile grows, so the claw's rail stays at the top and the plank in sight
  if (S) zoom += (Math.max(0.42, Math.min(1, (VH - RAIL_Y) / (VH - S.railY))) - zoom) * Math.min(1, dt * 4);
}

/* ---------- the scene ---------- */
/** What is right under x: the top of the highest thing there, or the plank, or the water. */
function under(x) {
  const pl = S.plank, dx = x - PIV.x;
  let y = dx > -HALF * pl.c && dx < HALF * pl.c ? PIV.y + dx * pl.s / pl.c - PLANK_H / 2 : WATER_Y;
  for (const b of S.bodies) if (b.tc != null && b.minx <= x && b.maxx >= x && b.miny < y) y = b.miny;
  for (const q of pl.parts) if (q.minx <= x && q.maxx >= x && q.miny < y) y = q.miny;
  return y;
}
function render() {
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
  c.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
  // The whole scene is drawn through the camera, which zooms about the bottom centre
  const z = S ? zoom : 1, L0 = -ox / sc, R0 = (vw - ox) / sc, T0 = -oy / sc, B0 = (vh - oy) / sc;
  const L = 200 + (L0 - 200) / z, R = 200 + (R0 - 200) / z, T = VH + (T0 - VH) / z, B = VH + (B0 - VH) / z, t = clock;
  c.save(); c.translate(200, VH); c.scale(z, z); c.translate(-200, -VH);

  // The night: stars, a moon, two ranges of hills and the water
  for (const s of STARS) { if (s.x < L || s.x > R || s.y < T) continue; c.globalAlpha = 0.35 + 0.45 * Math.sin(t * s.f + s.p) ** 2; c.fillStyle = '#fff'; c.beginPath(); c.arc(s.x, s.y, s.r, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  const mh = c.createRadialGradient(338, 196, 4, 338, 196, 46); mh.addColorStop(0, 'rgba(255,210,63,0.22)'); mh.addColorStop(1, 'rgba(255,210,63,0)');
  c.fillStyle = mh; c.beginPath(); c.arc(338, 196, 46, 0, 7); c.fill();
  c.save(); c.beginPath(); c.arc(338, 196, 14, 0, 7); c.clip();
  c.fillStyle = 'rgba(255,233,168,0.08)'; c.fillRect(322, 180, 32, 32);
  c.fillStyle = '#ffe9a8'; c.beginPath(); c.rect(322, 180, 32, 32); c.arc(344.5, 193, 12.5, 0, 7); c.fill('evenodd');
  c.restore();
  const hills = (base, h, color, k, edge) => {
    c.beginPath(); c.moveTo(L, B);
    for (let x = L; x <= R + 8; x += 8) c.lineTo(x, base - h * (0.55 + 0.25 * Math.sin(x * 0.011 * k + k) + 0.2 * Math.sin(x * 0.027 * k + 2 * k)));
    c.lineTo(R + 8, B); c.closePath(); c.fillStyle = color; c.fill(); c.strokeStyle = edge; c.lineWidth = 1; c.stroke();
  };
  hills(WATER_Y, 120, '#2e1258', 1, 'rgba(190,160,255,0.16)'); hills(WATER_Y, 62, '#1e0a3c', 1.7, 'rgba(190,160,255,0.12)');
  const wg = c.createLinearGradient(0, WATER_Y, 0, B); wg.addColorStop(0, '#173f7a'); wg.addColorStop(1, '#0a1a3a');
  c.fillStyle = wg; c.fillRect(L, WATER_Y, R - L, B - WATER_Y + 2);
  glow('#2ee6d6', 10, () => line(L, WATER_Y, R, WATER_Y, 'rgba(46,230,214,0.8)', 1.5));
  for (let i = 0; i < 9; i++) { const y = WATER_Y + 8 + i * 6, w = 14 + (i * 37) % 30, x = L + ((i * 131 + t * (10 + i * 3)) % (R - L + 80)) - 40; line(x, y, x + w, y, 'rgba(46,230,214,0.22)', 1.2); }

  if (!S) { c.restore(); return; }
  const P = S.P, pl = S.plank, railY = S.railY, holdY = railY + CLAW;
  c.save();
  if (shake > 0) c.translate((Math.random() - 0.5) * 14 * shake / 0.5, (Math.random() - 0.5) * 14 * shake / 0.5);

  // The rock the plank rests on
  const rg = c.createLinearGradient(0, PIV.y, 0, WATER_Y); rg.addColorStop(0, '#2a1458'); rg.addColorStop(1, '#0a0320');
  c.beginPath(); c.moveTo(PIV.x - 7, PIV.y + 4); c.lineTo(PIV.x + 7, PIV.y + 4); c.lineTo(PIV.x + 30, WATER_Y + 40); c.lineTo(PIV.x - 30, WATER_Y + 40); c.closePath();
  c.fillStyle = rg; c.fill(); glow('#2ee6d6', 6, () => { c.strokeStyle = 'rgba(46,230,214,0.55)'; c.lineWidth = 1.5; c.stroke(); });

  // The rail and the claw, with its fuse and the piece it holds
  line(PIV.x - P.range - 16, railY, PIV.x + P.range + 16, railY, 'rgba(190,160,255,0.35)', 3);
  for (const s of [-1, 1]) line(PIV.x + s * (P.range + 16), railY - 6, PIV.x + s * (P.range + 16), railY + 6, 'rgba(190,160,255,0.6)', 3);
  if (S.held) {
    const h = S.held, x = S.car.x, kind = h.spec.kind, f = Math.max(0, h.fuse / h.hold), hurry = h.fuse < 1.2;
    if (P.guide) { const y1 = under(x); c.setLineDash([5, 7]); line(x, holdY + h.shape.r + 6, x, y1 - 4, 'rgba(255,255,255,0.3)', 1.5); c.setLineDash([]); }
    line(x, railY, x, holdY, 'rgba(46,230,214,0.6)', 1.5);
    drawPiece(kind, h.shape, x, holdY, h.c, h.s);
    glow('#2ee6d6', 8, () => { c.fillStyle = '#2ee6d6'; c.beginPath(); c.roundRect(x - 11, railY - 6, 22, 12, 5); c.fill(); });
    const fc = hurry ? '#ff2e88' : '#ffd23f';
    glow(fc, 8, () => { c.strokeStyle = fc; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.arc(x, railY, 15 + (hurry ? Math.sin(t * 22) : 0), -1.5708, -1.5708 + 6.2832 * f); c.stroke(); });
    if (S.wind) {
      const d = S.wind > 0 ? 1 : -1, n = Math.abs(S.wind) > 100 ? 3 : 2;
      for (let i = 0; i < n; i++) { const wx = x + d * (34 + i * 12 + (t * 30) % 12), a = 0.7 - i * 0.2; line(wx - d * 5, holdY - 6, wx, holdY, `rgba(255,255,255,${a})`, 2); line(wx - d * 5, holdY + 6, wx, holdY, `rgba(255,255,255,${a})`, 2); }
    }
  }

  // The plank: the title's yellow → pink, and a knob that lights up green when it is level
  c.save(); c.transform(pl.c, pl.s, -pl.s, pl.c, PIV.x, PIV.y);
  const pg = c.createLinearGradient(-HALF, 0, HALF, 0); pg.addColorStop(0, '#ffd23f'); pg.addColorStop(1, '#ff2e88');
  glow('#ff7a4a', 14, () => { c.fillStyle = pg; c.beginPath(); c.roundRect(-HALF, -PLANK_H / 2, HALF * 2, PLANK_H, 6); c.fill(); });
  if (S.lip) for (const s of [-1, 1]) glow(s < 0 ? '#ffd23f' : '#ff2e88', 10, () => { c.fillStyle = s < 0 ? '#ffd23f' : '#ff2e88'; c.beginPath(); c.roundRect(s * (HALF - 4) - 4, -PLANK_H / 2 - S.lip, 8, S.lip + 4, 3); c.fill(); });
  line(-HALF + 6, -PLANK_H / 2 + 2.5, HALF - 6, -PLANK_H / 2 + 2.5, 'rgba(255,255,255,0.55)', 1.2);
  c.restore();
  const level = pl.s < PERFECT && pl.s > -PERFECT, kc = level ? '#9dff3a' : '#ffffff';
  glow(kc, level ? 16 : 6, () => { c.fillStyle = kc; c.beginPath(); c.arc(PIV.x, PIV.y, 6.5, 0, 7); c.fill(); });
  if (ring > 0) { c.globalAlpha = ring; c.strokeStyle = '#9dff3a'; c.lineWidth = 3; c.beginPath(); c.arc(PIV.x, PIV.y, 10 + (1 - ring) * 90, 0, 7); c.stroke(); c.globalAlpha = 1; }

  // The pile: what is welded to the plank a touch dimmer than the loose pieces on top
  for (const q of pl.parts) if (!q.lip) drawPiece(q.kind, q.shape, q.x, q.y, q.c, q.s, 1, 0.72);
  for (const b of S.bodies) drawPiece(b.kind, b.shape, b.x, b.y, b.c, b.s);

  c.globalCompositeOperation = 'lighter';
  for (const p of parts) { c.globalAlpha = 1 - p.t / p.life; c.fillStyle = p.color; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  for (const f of floats) { c.globalAlpha = 1 - f.t / 0.9; glow(f.color, 8, () => txt(f.text, f.x, f.y - f.t * 40, 22 / z, f.color)); }
  c.globalAlpha = 1;
  c.restore();
  c.restore();

  // From here on, drawn on the screen itself, not through the camera.
  // What is coming: the next two pieces, small and faint in the corner, the nearer one first
  if (S.phase === 'play') [[24, 22, 13, 0.5], [54, 22, 9, 0.28]].forEach(([x, y, r, a], i) => {
    const nx = S.queue[i]; if (!nx) return;
    const sh = KINDS[nx.kind].shape(nx.k);
    drawPiece(nx.kind, sh, x, y, 1, 0, r / sh.r, a);
  });

  if (banner) {
    const b = banner, K = KINDS[b.kind], a = Math.min(1, b.t * 5) * Math.min(1, (2.4 - b.t) * 2.5), y = 150;
    c.globalAlpha = a;
    glow(K.color, 14, () => txt(`Nueva: ${K.name}`, 200, y, 36, K.color));
    txt(K.trait, 200, y + 30, 15, 'rgba(255,255,255,0.85)', true);
    c.globalAlpha = 1;
  }
  for (const s of says) { c.globalAlpha = 1 - s.t / 1.3; glow(s.color, 14, () => txt(s.text, 200, 300 - s.t * 26, s.size, s.color)); }
  c.globalAlpha = 1;
  if (state === 'play' && S.landed < 2 && S.released < 3) txt(matchMedia('(pointer: fine)').matches ? 'Clic o Espacio para soltar' : 'Toca para soltar', 200, 585, 14, 'rgba(255,255,255,0.72)', true);
  if (state === 'pause') { c.fillStyle = 'rgba(21,7,38,0.72)'; c.fillRect(L0, T0, R0 - L0, B0 - T0); txt('En pausa', 200, 270, 44); txt('Toca para seguir', 200, 316, 17, 'rgba(255,255,255,0.72)', true); }
}
function hud() {
  if (!S) { $('#count').textContent = ''; $('#score').textContent = ''; $('#chip').hidden = true; return; }
  $('#count').textContent = `🧱 ${S.landed}`;
  $('#score').textContent = S.score;
  $('#chip').hidden = S.streak < 2; $('#chip').textContent = `🔥 ×${S.streak}`;
}

/* ---------- the flow ---------- */
const card = $('#card');
function showCard(emoji, title, html, btn) { $('#cEmoji').textContent = emoji; $('#cTitle').textContent = title; $('#cBody').innerHTML = html; $('#cBtn').textContent = btn; card.hidden = false; }
function ready() {
  showCard('⚖️', 'La Balanza', `<ol>
    <li>La pieza va y viene sola: toca para soltarla sobre la tabla.</li>
    <li>Apila todo lo que puedas: las piezas no dejan de llegar, y cada vez más rápido.</li>
    <li>Reparte el peso para que la tabla no se incline. En la esquina se asoman las piezas que vienen.</li>
    <li>Si una sola pieza cae al agua, se acaba.</li></ol>
    <p class="nota">Cada pieza que se queda vale 1 punto. Si la tabla queda nivelada es ¡Perfecto!, y cada uno seguido suma 1, 2, 3… hasta 5 más. Si te demoras, la garra la suelta sola y esa no suma.</p>`, '▶ Jugar');
}
const query = new URLSearchParams(location.search), seedParam = query.get('seed');
/** Lab only: `?from=30` starts as hard as if 30 pieces were already down (on an empty plank), to try the late pieces. */
const fromParam = Math.max(0, Math.floor(Number(query.get('from')) || 0));
function start() {
  S = newGame(seedParam != null ? Number(seedParam) | 0 : Date.now() | 0, fromParam);
  state = 'play'; acc = 0; tapQ = false; parts = []; floats = []; says = []; banner = null; zoom = 1; card.hidden = true;
}
const plural = (n, f) => f[n === 1 ? 1 : n ? 2 : 0];
function finish() {
  state = 'over';
  const s = Math.round(S.t), time = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`, metros = (S.peak / 40).toFixed(1).replace('.', ',');
  showCard('⚖️', 'Fin del juego', `<p class="big">${S.score}</p><ul>
    <li>🧱 ${S.landed} ${plural(S.landed, ['piezas apiladas', 'pieza apilada', 'piezas apiladas'])}: +${S.landed}.</li>
    <li>✨ ${S.perfects} ${plural(S.perfects, ['perfectos', 'perfecto', 'perfectos'])}: +${S.bonus}.</li>
    <li>🔥 Racha perfecta más larga: ${S.best}.</li>
    <li>📏 Tu pila llegó a ${metros} m de alto.</li>
    <li>⏱ Tiempo: ${time}.</li></ul>`, '↻ Otra vez');
}
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; clock += dt;
  if (S && state === 'play') {
    acc += dt;
    for (let n = 0; acc >= DT && n < 8; n++) { advance(S, tapQ); tapQ = false; acc -= DT; for (const e of S.ev) onEvent(e); S.ev.length = 0; }
    if (acc > DT * 8) acc = 0;
    if (S.done) finish();
  }
  fx(dt); render(); hud(); requestAnimationFrame(frame);
}

/* ---------- input: a touch or a click anywhere, or Space ---------- */
function press() {
  audio();
  if (!card.hidden) return $('#cBtn').click();
  if (state === 'pause') { state = 'play'; return; }
  if (state === 'play') tapQ = true;
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) press(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });
$('#cBtn').addEventListener('click', e => { e.currentTarget.blur(); audio(); start(); });
const muteBtn = $('#mute'), paintMute = () => { muteBtn.textContent = muted ? '🔇' : '🔊'; };
muteBtn.addEventListener('click', () => { muted = !muted; try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (_) { /* no storage */ } paintMute(); muteBtn.blur(); });
window.addEventListener('resize', resize);
paintMute(); resize(); ready(); requestAnimationFrame(frame);
window.__balanza = { get S() { return S; }, get state() { return state; }, finish, newGame, advance, stepWorld, mkBody, weld, place, rect, params, KINDS, UNLOCK, PIV, DT, HALF, CLAW, WATER_Y,
  show(s, st = 'play') { S = s; state = st; card.hidden = true; for (const e of s.ev) onEvent(e); s.ev.length = 0; }, fx, render, hud };
</script>
