<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="screen" content="none">
  <title>La Copa</title>
  <script src="../../assets/js/vigia.js"></script>
  <!--
    The player's cups for their profile (lab flag profile), with no screen: the profile opens this page in a
    hidden frame with `#c=CODE.pid,…` and it posts back each cup's name, dates, the player's place and who won,
    ranked with the cup's engine, so the profile does not load the engine itself (D-377). `?test`: La Copa's test store.
  -->
</head>
<body>
  <script type="module">
    import { loadHistory, cupsOfHash } from '../history.js';
    const post = lines => parent.postMessage({ type: 'cup-history', lines }, location.origin);
    loadHistory(cupsOfHash(location.hash), { test: /[?&]test\b/.test(location.search) }).then(post, () => post(null));
  </script>
</body>
</html>
