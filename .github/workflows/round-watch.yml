# The processes round's watchdog (D-440): the round runs on the owner's Mac mini, and when it stops
# nothing else would say so. Every day at 10:17 Pacific (17:17 UTC; 9:17 in winter), well after the
# 4:30 round and its PR's merge, tools/agents/round-watch.mjs looks at what the round left on main:
# if a commit it has not looked at is more than a day old, it opens the "Processes round missed"
# issue (GitHub emails the owner); when the round catches up, it closes it. It also runs when the
# round's memory changes on main, so the issue closes as soon as the round's PR merges.
# A second step watches the heartbeat the same way (D-565, tools/push/heartbeat-watch.mjs): the
# "Heartbeat behind" issue when the notifications or Uno al día's rebuild stopped or had gaps yesterday.

name: Processes round watchdog

on:
  schedule:
    - cron: '17 17 * * *'
  push:
    branches: [main]
    paths: ['docs/processes.json']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: round-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # A week of merges fits easily; a checkedUpTo older than this counts as far behind
          fetch-depth: 1500
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Is the round behind?
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/agents/round-watch.mjs notify
      # The heartbeat's watchdog (D-565): notifications every 5 minutes and Uno al día every hour
      - name: Is the heartbeat behind?
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_JSON: ${{ secrets.FIREBASE_ADMIN_JSON }}
        run: |
          if [ -z "$KEY_JSON" ]; then echo "::warning::FIREBASE_ADMIN_JSON is missing: the heartbeat is not checked"; exit 0; fi
          umask 077
          printf '%s' "$KEY_JSON" > "$RUNNER_TEMP/key.json"
          FIREBASE_KEY="$RUNNER_TEMP/key.json" node tools/push/heartbeat-watch.mjs notify
